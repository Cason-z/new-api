name: Codex GHCR build

on:
  push:
    branches:
      - codex/chat-image-bridge
  workflow_dispatch:

jobs:
  build_amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="chat-image-bridge-$(git rev-parse --short HEAD)"
          echo "$VERSION" > VERSION
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_REPOSITORY }}:chat-image-bridge
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
